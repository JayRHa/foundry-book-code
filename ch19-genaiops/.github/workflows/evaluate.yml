name: "AI Agent Evaluation"
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  run-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure login using Federated Credentials
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run Evaluation
        uses: microsoft/ai-agent-evals@v3-beta
        with:
          azure-ai-project-endpoint: "<your-ai-project-endpoint>"   # project Overview page
          deployment-name: "<judge-model-deployment>"               # Models + endpoints
          agent-ids: "my-agent:1,my-agent:2"                        # compare versions
          data-path: ${{ github.workspace }}/evals/dataset.json
